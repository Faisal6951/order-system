# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5490/orderdb
spring.datasource.username=orderuser
spring.datasource.password=orderpass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# App
spring.application.name=order-service
server.port=8080

spring.cache.type=redis
spring.cache.redis.time-to-live=600000

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.group-id=order-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.security.user.name=disabled
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

spring.devtools.restart.enabled=false
spring.data.web.pageable.max-page-size=50

spring.data.redis.timeout=500ms
ratelimit.requests-per-minute=100

jwt.access-expiration-ms=900000
jwt.refresh-expiration-days=7

management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=always

logging.pattern.level=%5p [%X{requestId:-}]

jwt.secret=${JWT_SECRET}